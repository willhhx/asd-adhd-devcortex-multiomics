# Factor analysis, pooled class x stage-group annotations (analysis plan v3).
seed: 2026
atlas:
  name: wang2025_snMultiome          # 38 samples / 27 donors; built by scripts/03b_build_wang_atlas.py
  cell_type_col: cell_type           # = Type_updated (34 types)
  stage_col: stage                   # = Group
  donor_col: donor
  sample_col: sample
  stage_order: [Early_fetal, Mid_late_fetal, Postnatal]
  min_nuclei_per_state: 300
  min_donors_per_state: 3
  nuclei_per_state: 300
peaksets:
  method: log2fc
  top_n: 20000
  min_cpm: 1.0
traits:
  F1: {role: target,           n_eff: 54100}      # Compulsive (PGC CDG3 2025; README implied N)
  F2: {role: positive_control, n_eff: 127202}     # Schizophrenia/Bipolar
  F3: {role: target,           n_eff: 84760}      # Neurodevelopmental (ASD, ADHD, Tourette)
  F4: {role: target,           n_eff: 1637337}    # Internalizing
  F5: {role: target,           n_eff: 313395}     # Substance use
  PFactor: {role: target,      n_eff: 2168621}    # Hierarchical p-factor
  HEIGHT: {role: negative_control}
contrasts:
  - [F3, F2]   # primary pre-specified
  - [F4, F2]   # secondary pre-specified (glia vs neuron)
finemap:
  p_threshold: 5.0e-8
  window: 500000
  credible_level: 0.95
  enrichment_cap: 10.0
  fdr_for_prior: 0.05
